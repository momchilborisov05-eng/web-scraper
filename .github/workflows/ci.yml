name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: "Tests with coverage (offline: the fixture site replaces the network)"
        run: |
          coverage run -m pytest -q
          coverage report --fail-under=85
      - name: Benchmark (smoke run)
        if: matrix.python == '3.12'
        run: python scripts/benchmark.py --books 150 --workers 1,4 --polite-pages 12 --quick --out bench-ci
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: bench-ci/

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: trawl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Crawl the fixture inside the image, then exercise the dashboard API
        run: |
          docker volume create trawl-ci
          docker run --rm -v trawl-ci:/data trawl:ci python -m trawl demo --db /data/trawl.db --books 100 --versions 2
          docker run -d --name trawl -p 8000:8000 -v trawl-ci:/data trawl:ci
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/api/summary | grep -q '"runs":2'
          curl -fsS "http://localhost:8000/api/changes?limit=5" | grep -q '"changes"'
          test "$(docker inspect -f '{{.Config.User}}' trawl)" = "app"
      - if: always()
        run: docker logs trawl || true
